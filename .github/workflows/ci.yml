name: ci

on:
  push:
    branches: ["main", "agent/**", "cto/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # Actions are pinned to full commit SHAs (the commits their v4 tags pointed to when pinned), so a
      # moved tag cannot change what runs here. Update the SHA and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: install pinned dependencies (lockfile only)
        run: npm ci --ignore-scripts
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build
      - name: acceptance commands
        run: |
          KEYS=tests/keys/keelstamp-keys.json
          node bin/verify.mjs tests/fixtures/valid.json --keys "$KEYS"
          node bin/verify.mjs tests/fixtures/valid.json --keys "$KEYS" --checkpoint tests/fixtures/checkpoint.json
          expect_fail() {
            set +e; "$@"; code=$?; set -e
            test "$code" -ne 0 || { echo "accepted, expected rejection: $*"; exit 1; }
          }
          expect_fail node bin/verify.mjs tests/fixtures/invalid-altered-payload.json --keys "$KEYS"
          expect_fail node bin/verify.mjs tests/fixtures/invalid-inclusion-path.json --keys "$KEYS"
          # no --keys: never verified, never a keys file from next to the receipt
          expect_fail node bin/verify.mjs tests/fixtures/valid.json
      - name: upload the web page
        if: matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keelstamp-verifier-html
          path: dist/keelstamp-verifier.html
          if-no-files-found: error
